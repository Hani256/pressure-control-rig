<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="960" viewBox="0 0 1020 960" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect width="1020" height="960" fill="#ffffff"/>

  <text x="24" y="30" font-size="19" font-weight="bold" fill="#1F4E79">Pressure rig wiring</text>
  <text x="24" y="48" font-size="11.5" fill="#555">STM32F411 Black Pill · AHT20 + BMP280 · SSD1306 OLED · 120 mm PWM fan</text>

  <!-- rails -->
  <g stroke-width="1.8">
    <line x1="230" y1="92"  x2="962" y2="92"  stroke="#c0392b"/>
    <line x1="230" y1="124" x2="790" y2="124" stroke="#2980b9"/>
    <line x1="230" y1="150" x2="790" y2="150" stroke="#8e44ad"/>
    <line x1="230" y1="410" x2="948" y2="410" stroke="#111"/>
  </g>
  <g font-size="11">
    <text x="236" y="86"  fill="#c0392b" font-weight="bold">3V3</text>
    <text x="236" y="118" fill="#2980b9" font-weight="bold">SDA</text>
    <text x="236" y="144" fill="#8e44ad" font-weight="bold">SCL</text>
    <text x="236" y="426" fill="#111" font-weight="bold">GND   one common ground for everything</text>
  </g>

  <!-- MCU -->
  <rect x="48" y="68" width="182" height="358" rx="5" fill="#eef4fb" stroke="#1F4E79" stroke-width="1.6"/>
  <text x="60" y="88" font-size="12.5" font-weight="bold" fill="#1F4E79">STM32F411</text>
  <text x="60" y="103" font-size="11" fill="#1F4E79">Black Pill</text>
  <text x="60" y="132" font-size="10" fill="#666">flash over SWD</text>
  <text x="60" y="146" font-size="10" fill="#666">with the ST-Link</text>
  <g font-size="11" fill="#111" text-anchor="end">
    <text x="224" y="88">3V3</text>
    <text x="224" y="120">PB7 · SDA</text>
    <text x="224" y="146">PB6 · SCL</text>
    <text x="224" y="296">PA6 · PWM</text>
    <text x="224" y="336">PA0 · TACH</text>
    <text x="224" y="406">GND</text>
  </g>

  <!-- PA6 / PA0 nets -->
  <line x1="230" y1="300" x2="842" y2="300" stroke="#e67e22" stroke-width="1.8"/>
  <line x1="230" y1="340" x2="842" y2="340" stroke="#16a085" stroke-width="1.8"/>
  <text x="300" y="293" font-size="10.5" fill="#e67e22">PWM, 25 kHz</text>
  <text x="300" y="356" font-size="10.5" fill="#16a085">tach, open collector</text>

  <!-- sensor module -->
  <rect x="352" y="198" width="184" height="74" rx="4" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <text x="362" y="220" font-size="12" font-weight="bold">AHT20 + BMP280</text>
  <text x="362" y="236" font-size="10.5" fill="#555">BMP280 0x76 · AHT20 0x38</text>
  <text x="362" y="252" font-size="10.5" fill="#b91c1c">this one goes INSIDE the box</text>
  <g stroke="#333" stroke-width="1.4">
    <line x1="376" y1="198" x2="376" y2="92"/>
    <line x1="412" y1="198" x2="412" y2="124"/>
    <line x1="448" y1="198" x2="448" y2="150"/>
    <line x1="500" y1="272" x2="500" y2="410"/>
  </g>
  <g font-size="9.5" fill="#444">
    <text x="364" y="192">VCC</text><text x="400" y="192">SDA</text><text x="436" y="192">SCL</text>
    <text x="488" y="292">GND</text>
  </g>

  <!-- OLED -->
  <rect x="612" y="198" width="170" height="74" rx="4" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <text x="622" y="220" font-size="12" font-weight="bold">OLED SSD1306</text>
  <text x="622" y="236" font-size="10.5" fill="#555">0x3C, same I2C bus</text>
  <text x="622" y="252" font-size="10.5" fill="#555">stays outside the box</text>
  <g stroke="#333" stroke-width="1.4">
    <line x1="634" y1="198" x2="634" y2="92"/>
    <line x1="670" y1="198" x2="670" y2="124"/>
    <line x1="706" y1="198" x2="706" y2="150"/>
    <line x1="754" y1="272" x2="754" y2="410"/>
  </g>
  <g font-size="9.5" fill="#444">
    <text x="622" y="192">VCC</text><text x="658" y="192">SDA</text><text x="694" y="192">SCL</text>
    <text x="742" y="292">GND</text>
  </g>

  <!-- I2C pull-ups -->
  <g stroke="#333" stroke-width="1.4">
    <line x1="556" y1="92" x2="556" y2="110"/>
    <rect x="548" y="110" width="16" height="26" fill="#fff" stroke-width="1.3"/>
    <line x1="556" y1="136" x2="556" y2="124"/>
    <line x1="590" y1="92" x2="590" y2="118"/>
    <rect x="582" y="118" width="16" height="26" fill="#fff" stroke-width="1.3"/>
    <line x1="590" y1="144" x2="590" y2="150"/>
  </g>
  <text x="496" y="176" font-size="10" fill="#666">2 x 4k7, only if the modules have no pull-ups of their own</text>

  <!-- tach pull-up -->
  <g stroke="#333" stroke-width="1.4">
    <line x1="812" y1="92" x2="812" y2="200"/>
    <rect x="804" y="200" width="16" height="28" fill="#fff" stroke-width="1.3"/>
    <line x1="812" y1="228" x2="812" y2="340"/>
  </g>
  <text x="824" y="222" font-size="10" fill="#666">10k</text>

  <!-- fan -->
  <rect x="842" y="270" width="132" height="122" rx="4" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <text x="852" y="288" font-size="12" font-weight="bold">120 mm fan</text>
  <g font-size="10.5" fill="#111">
    <text x="852" y="304">4  blue    PWM</text>
    <text x="852" y="344">3  green  TACH</text>
    <text x="852" y="366">2  yellow  +12V</text>
    <text x="852" y="384">1  black   GND</text>
  </g>
  <line x1="906" y1="392" x2="906" y2="410" stroke="#111" stroke-width="1.6"/>

  <!-- 12 V supply -->
  <rect x="842" y="120" width="132" height="54" rx="4" fill="#fdf6e3" stroke="#b7791f" stroke-width="1.5"/>
  <text x="852" y="142" font-size="12" font-weight="bold" fill="#8a5a00">12 V supply</text>
  <text x="852" y="158" font-size="10" fill="#8a5a00">separate from the board</text>
  <line x1="962" y1="174" x2="962" y2="362" stroke="#b7791f" stroke-width="1.8"/>
  <line x1="962" y1="362" x2="974" y2="362" stroke="#b7791f" stroke-width="1.8"/>
  <text x="966" y="192" font-size="11" fill="#8a5a00">+</text>
  <line x1="932" y1="174" x2="932" y2="410" stroke="#111" stroke-width="1.6"/>
  <text x="918" y="192" font-size="11" fill="#111">-</text>

  <g fill="#111">
    <circle cx="376" cy="92" r="3.4"/><circle cx="412" cy="124" r="3.4"/><circle cx="448" cy="150" r="3.4"/>
    <circle cx="634" cy="92" r="3.4"/><circle cx="670" cy="124" r="3.4"/><circle cx="706" cy="150" r="3.4"/>
    <circle cx="556" cy="92" r="3.4"/><circle cx="590" cy="92" r="3.4"/>
    <circle cx="556" cy="124" r="3.4"/><circle cx="590" cy="150" r="3.4"/>
    <circle cx="812" cy="92" r="3.4"/><circle cx="812" cy="340" r="3.4"/>
    <circle cx="500" cy="410" r="3.4"/><circle cx="754" cy="410" r="3.4"/>
    <circle cx="906" cy="410" r="3.4"/><circle cx="932" cy="410" r="3.4"/>
  </g>

  <text x="24" y="450" font-size="11.5" font-weight="bold" fill="#b91c1c">
    Tie the 12 V minus to the board GND. Without that shared ground the fan ignores the PWM.
  </text>

  <!-- ================= alternative ================= -->
  <rect x="24" y="468" width="972" height="196" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.3" stroke-dasharray="6,4"/>
  <text x="40" y="492" font-size="13" font-weight="bold" fill="#1F4E79">Only if the fan has 3 wires and no PWM input: switch it on the low side</text>
  <text x="40" y="510" font-size="10.5" fill="#555">Set MODE_MOSFET to 1 in 02_fan.ino. The tach reading is not reliable in this mode.</text>

  <!-- +12 V rail -->
  <line x1="300" y1="534" x2="700" y2="534" stroke="#b7791f" stroke-width="1.8"/>
  <text x="708" y="538" font-size="11" fill="#8a5a00">+12 V</text>
  <!-- GND rail -->
  <line x1="120" y1="642" x2="700" y2="642" stroke="#111" stroke-width="1.8"/>
  <text x="708" y="646" font-size="11" fill="#111">GND</text>

  <!-- fan -->
  <rect x="380" y="548" width="126" height="46" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="390" y="567" font-size="11.5" font-weight="bold">fan, 3 wire</text>
  <text x="390" y="583" font-size="10" fill="#555">red up, black down</text>
  <line x1="443" y1="548" x2="443" y2="534" stroke="#333" stroke-width="1.6"/>
  <line x1="443" y1="594" x2="443" y2="612" stroke="#333" stroke-width="1.6"/>
  <line x1="246" y1="612" x2="443" y2="612" stroke="#333" stroke-width="1.6"/>

  <!-- flyback diode -->
  <line x1="580" y1="612" x2="580" y2="592" stroke="#333" stroke-width="1.6"/>
  <line x1="443" y1="612" x2="580" y2="612" stroke="#333" stroke-width="1.6"/>
  <g transform="translate(580,574)">
    <path d="M-9,10 L9,10 L0,-4 z" fill="#333"/>
    <line x1="-10" y1="-6" x2="10" y2="-6" stroke="#333" stroke-width="3"/>
  </g>
  <line x1="580" y1="568" x2="580" y2="534" stroke="#333" stroke-width="1.6"/>
  <text x="596" y="578" font-size="10.5" fill="#b91c1c">1N4007, stripe on top, towards +12 V</text>
  <text x="596" y="592" font-size="10" fill="#666">without it the transistor dies</text>

  <!-- transistor -->
  <text x="60" y="600" font-size="11" fill="#111">PA6</text>
  <line x1="88" y1="596" x2="124" y2="596" stroke="#e67e22" stroke-width="1.8"/>
  <rect x="124" y="584" width="32" height="24" fill="#fff" stroke="#333" stroke-width="1.3"/>
  <text x="128" y="578" font-size="10" fill="#666">1k</text>
  <line x1="156" y1="596" x2="212" y2="596" stroke="#333" stroke-width="1.6"/>
  <line x1="212" y1="572" x2="212" y2="620" stroke="#333" stroke-width="2.6"/>
  <line x1="212" y1="582" x2="246" y2="612" stroke="#333" stroke-width="1.8"/>
  <line x1="212" y1="610" x2="246" y2="642" stroke="#333" stroke-width="1.8"/>
  <path d="M231,629 L246,642 L235,637 z" fill="#333"/>
  <text x="196" y="566" font-size="11">2N2222 or S8050</text>
  <text x="252" y="658" font-size="10" fill="#666">emitter to GND</text>
  <circle cx="443" cy="612" r="3.4" fill="#111"/>
  <circle cx="443" cy="534" r="3.4" fill="#111"/>
  <circle cx="580" cy="534" r="3.4" fill="#111"/>
  <circle cx="246" cy="642" r="3.4" fill="#111"/>

  <!-- ================= chamber ================= -->
  <text x="24" y="702" font-size="13" font-weight="bold" fill="#1F4E79">The chamber</text>

  <rect x="150" y="718" width="320" height="160" rx="6" fill="#f4f8fc" stroke="#1F4E79" stroke-width="2"/>
  <text x="310" y="742" font-size="11" fill="#1F4E79" text-anchor="middle">sealed box, or a plastic bag</text>

  <circle cx="150" cy="800" r="32" fill="#fff" stroke="#333" stroke-width="1.8"/>
  <path d="M150,800 m-20,0 a20,20 0 0,1 20,-20" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M150,800 m0,-20 a20,20 0 0,1 20,20" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M150,800 m20,0 a20,20 0 0,1 -20,20" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M150,800 m0,20 a20,20 0 0,1 -20,-20" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="66" y="798" font-size="11" text-anchor="end">fan</text>
  <text x="66" y="813" font-size="10" fill="#666" text-anchor="end">blowing in</text>
  <path d="M186,800 L224,800" stroke="#1F4E79" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="262" y="782" width="128" height="44" rx="3" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <text x="272" y="800" font-size="10.5">AHT20 + BMP280</text>
  <text x="272" y="815" font-size="9.5" fill="#666">wires out, then seal the hole</text>

  <circle cx="470" cy="756" r="5" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
  <text x="486" y="752" font-size="10.5" fill="#b91c1c">leak hole</text>
  <text x="486" y="766" font-size="9.5" fill="#666">tape over part of it and you have</text>
  <text x="486" y="779" font-size="9.5" fill="#666">a different "unit" to calibrate</text>

  <g font-size="10.5" fill="#333">
    <text x="486" y="806">A smaller box responds faster: the time constant</text>
    <text x="486" y="822">goes with volume divided by leak size.</text>
    <text x="486" y="840">Seal every seam. A leaky box shows almost nothing.</text>
    <text x="486" y="858">A plastic bag taped around the fan works too,</text>
    <text x="486" y="874">and it inflates and deflates the same way.</text>
  </g>

  <text x="24" y="920" font-size="10.5" fill="#666">Fan connector: pin 1 is the one next to the plastic locking tab. Order is black, yellow, green, blue.</text>
  <text x="24" y="938" font-size="10.5" fill="#666">Run 01_sensors first with no fan connected, and write down the noise sigma it prints.</text>
</svg>
